<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thinkpad Club</title>
  <style>
    body { margin: 0; background: white; color: black; font-family: 'Times New Roman', serif; }
    main { box-sizing: border-box; max-width: 750px; margin: 40px auto; padding: 0 16px; }
    h1 { font-weight: 100; font-size: 50px; }
    img { display: block; width: 100%; height: auto; }
    a, button { color: purple; font: inherit; text-decoration: underline; }
    button { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
    a:hover, button:hover { text-decoration: underline; }
    button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <h1>Thinkpad Club</h1>
    <section data-webcam>
      <img data-webcam-image src="/webcam/current.jpg" alt="">
      <br>
      <button type="button" data-webcam-update>/update-webcam</button> <span data-webcam-spinner aria-hidden="true"></span><br>
      <button type="button" data-new-page>/new-page</button><br>
      <a href="/edit/index" target="_top">/edit-page</a><br>
      <a href="/edit/server" target="_top">/server</a><br>
      <button type="button" data-robot-direction="right">/right</button> <span data-robot-spinner="right" aria-hidden="true"></span><br>
      <button type="button" data-robot-direction="left">/left</button> <span data-robot-spinner="left" aria-hidden="true"></span><br>
      <div data-robot-status role="status" aria-live="polite"></div>
      <div data-webcam-status role="status" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
