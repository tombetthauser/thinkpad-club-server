<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Escape the Ghast and Blaze</title>
    <!--
      Blocky “Minecraft style” scene: boxes and colors in HTML + CSS.
      Fireball: scripted arc + ground jiggle; optional custom ball image.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #87ceeb;
        font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
      }

      .page-box {
        max-width: 720px;
        margin: 20px auto;
        padding: 20px 24px 28px;
        border: 3px dashed #6ec4e8;
        border-radius: 16px;
        background: #e8f4fc;
        box-sizing: border-box;
      }

      h1 {
        text-align: center;
        color: #1a1a1a;
        font-size: 1.65rem;
        margin: 0 0 20px;
        text-shadow: 1px 1px 0 #fff;
      }

      .scene {
        position: relative;
        height: 300px;
        margin: 0 auto;
        max-width: 640px;
        border: 2px solid #333;
        border-radius: 8px;
        background: linear-gradient(180deg, #b8e0ff 0%, #d4eeff 55%, #c9e8c0 55%, #a3d9a5 100%);
        overflow: hidden;
      }

      .ground-line {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 52px;
        height: 4px;
        background: #5d4e37;
        z-index: 1;
      }

      .portal {
        position: absolute;
        left: 8px;
        bottom: 56px;
        width: 44px;
        height: 70px;
        background: repeating-linear-gradient(
          90deg,
          #1a0528,
          #1a0528 4px,
          #3d1a5c 4px,
          #3d1a5c 8px
        );
        border: 4px solid #111;
        transform: rotate(-8deg);
        z-index: 2;
        box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
      }

      .portal::before,
      .portal::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #c9a0ff;
        opacity: 0.9;
      }

      .portal::before {
        left: 8px;
        top: 12px;
      }

      .portal::after {
        right: 6px;
        bottom: 18px;
        width: 6px;
        height: 6px;
        background: #e0d4ff;
      }

      .player-wrap {
        position: absolute;
        left: 58px;
        bottom: 56px;
        z-index: 3;
        display: flex;
        align-items: flex-end;
        gap: 4px;
      }

      .speed-lines {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 18px;
        animation: speedPulse 0.35s ease-in-out infinite alternate;
      }

      @keyframes speedPulse {
        from {
          opacity: 0.65;
          transform: translateX(0);
        }
        to {
          opacity: 1;
          transform: translateX(-3px);
        }
      }

      .speed-lines span {
        display: block;
        height: 3px;
        background: #333;
        border-radius: 1px;
      }

      .speed-lines span:nth-child(1) {
        width: 14px;
      }

      .speed-lines span:nth-child(2) {
        width: 18px;
      }

      .speed-lines span:nth-child(3) {
        width: 12px;
      }

      .player {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .player .head {
        width: 22px;
        height: 22px;
        background: #d4a574;
        border: 2px solid #333;
      }

      .player .body {
        width: 24px;
        height: 28px;
        background: #2e7d32;
        border: 2px solid #333;
        margin-top: -2px;
      }

      .player .legs {
        display: flex;
        gap: 4px;
        margin-top: -2px;
      }

      .player .legs span {
        width: 9px;
        height: 14px;
        background: #1e5a8c;
        border: 2px solid #333;
      }

      /* Fireball — position base + JS translate; inner ball squashes on impact */
      .fireball {
        position: absolute;
        left: 52%;
        bottom: 198px;
        z-index: 4;
        display: flex;
        align-items: center;
        will-change: transform;
        filter: drop-shadow(2px 4px 6px rgba(255, 80, 0, 0.45));
      }

      .fireball .trail {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-right: 4px;
        animation: trailWhip 0.22s ease-in-out infinite alternate;
      }

      @keyframes trailWhip {
        from {
          opacity: 0.85;
          transform: skewY(-4deg) scaleX(1);
        }
        to {
          opacity: 1;
          transform: skewY(6deg) scaleX(1.15);
        }
      }

      .fireball .trail span {
        display: block;
        height: 3px;
        background: linear-gradient(90deg, #ffecb3, #ff6b35);
        border-radius: 2px;
        box-shadow: 0 0 4px #ff9800;
      }

      .fireball .trail span:nth-child(1) {
        width: 18px;
      }

      .fireball .trail span:nth-child(2) {
        width: 26px;
      }

      .fireball .trail span:nth-child(3) {
        width: 16px;
      }

      .fireball .ball-outer {
        --ball-size: 22px;
        width: var(--ball-size);
        height: var(--ball-size);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 100%;
        will-change: transform;
      }

      .fireball .ball-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-origin: 50% 100%;
        will-change: transform;
      }

      .fireball .ball-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .fireball .ball-default {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #ffffff;
        border: none;
        box-shadow: none;
      }

      .fireball .ball-default.is-hidden {
        display: none;
      }

      .fireball .ball-inner img.is-hidden {
        display: none;
      }


      .ghast {
        position: absolute;
        left: 50%;
        top: 28px;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: floaty 2.2s ease-in-out infinite;
      }

      @keyframes floaty {
        0%,
        100% {
          transform: translateX(-50%) translateY(0) rotate(-1deg);
        }
        35% {
          transform: translateX(-50%) translateY(-14px) rotate(2deg);
        }
        65% {
          transform: translateX(-50%) translateY(-6px) rotate(-2deg);
        }
      }

      .ghast-body {
        width: 100px;
        height: 90px;
        background: #eceff1;
        border: 3px solid #37474f;
        box-shadow: inset -6px -6px 0 rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .ghast-eyes {
        display: flex;
        gap: 18px;
      }

      .ghast-eyes span {
        width: 22px;
        height: 22px;
        background: #263238;
        border: 2px solid #111;
      }

      .ghast-mouth {
        width: 14px;
        height: 10px;
        background: #263238;
        border: 2px solid #111;
      }

      .ghast-tentacles {
        display: flex;
        gap: 6px;
        margin-top: -2px;
      }

      .ghast-tentacles span {
        width: 10px;
        height: 36px;
        background: #cfd8dc;
        border: 2px solid #37474f;
        border-top: none;
      }

      .blaze {
        position: absolute;
        right: 24px;
        bottom: 58px;
        z-index: 3;
        width: 70px;
        height: 70px;
        animation: blazeShiver 1.8s ease-in-out infinite;
      }

      @keyframes blazeShiver {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-2px, -3px);
        }
      }

      .blaze span {
        position: absolute;
        width: 8px;
        height: 28px;
        background: #ffc107;
        border: 1px solid #e65100;
        border-radius: 2px;
        box-shadow: 0 0 4px #ff9800;
      }

      .blaze span:nth-child(1) {
        left: 10px;
        top: 8px;
        transform: rotate(-12deg);
      }

      .blaze span:nth-child(2) {
        left: 26px;
        top: 0;
        transform: rotate(4deg);
        height: 32px;
      }

      .blaze span:nth-child(3) {
        left: 42px;
        top: 12px;
        transform: rotate(18deg);
      }

      .blaze span:nth-child(4) {
        left: 18px;
        top: 28px;
        transform: rotate(-6deg);
        height: 26px;
      }

      .blaze span:nth-child(5) {
        left: 36px;
        top: 32px;
        transform: rotate(10deg);
      }

      .ball-controls {
        margin-top: 14px;
        padding: 14px 16px;
        border: 2px solid #90caf9;
        border-radius: 12px;
        background: #f5fbff;
        font-size: 0.88rem;
      }

      .ball-controls h2 {
        margin: 0 0 10px;
        font-size: 1rem;
        color: #1565c0;
      }

      .ball-controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 16px;
      }

      @media (max-width: 560px) {
        .ball-controls-grid {
          grid-template-columns: 1fr;
        }
      }

      .ball-controls label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
        color: #333;
      }

      .ball-controls input[type="range"] {
        width: 100%;
      }

      .ball-controls .row-checks {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .ball-controls .row-checks label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: normal;
        margin: 0;
      }

      .trim-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .trim-grid label span {
        font-weight: normal;
        opacity: 0.85;
      }

      .trim-grid input[type="range"] {
        margin-top: 2px;
      }

      .caption {
        margin-top: 16px;
        text-align: center;
        color: #333;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="page-box">
      <h1>Escape the Ghast and Blaze</h1>

      <div class="scene" role="img" aria-label="Side view: player runs from a Ghast fireball near a portal; a Blaze floats on the right.">
        <div class="ground-line"></div>

        <div class="portal" aria-hidden="true"></div>

        <div class="player-wrap">
          <div class="speed-lines" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div class="player">
            <div class="head"></div>
            <div class="body"></div>
            <div class="legs"><span></span><span></span></div>
          </div>
        </div>

        <div class="fireball" id="fireball" aria-hidden="true">
          <div class="trail">
            <span></span><span></span><span></span>
          </div>
          <div class="ball-outer" id="ballOuter">
            <div class="ball-inner" id="ballInner">
              <img id="ballImg" class="is-hidden" alt="" />
              <div class="ball-default" id="ballDefault"></div>
            </div>
          </div>
        </div>

        <div class="ghast">
          <div class="ghast-body">
            <div class="ghast-eyes"><span></span><span></span></div>
            <div class="ghast-mouth"></div>
          </div>
          <div class="ghast-tentacles">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="blaze" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="ball-controls">
        <h2>Fireball image</h2>
        <div class="ball-controls-grid">
          <div>
            <label for="ballUpload">Upload image</label>
            <input id="ballUpload" type="file" accept="image/*" />
          </div>
          <div>
            <label for="ballSize">Ball size <span id="ballSizeLabel">22</span> px</label>
            <input id="ballSize" type="range" min="14" max="56" value="22" />
          </div>
          <div class="row-checks" style="grid-column: 1 / -1">
            <label><input id="flipH" type="checkbox" /> Flip horizontal</label>
            <label><input id="flipV" type="checkbox" /> Flip vertical</label>
          </div>
          <div style="grid-column: 1 / -1">
            <label>Trim edges (%)</label>
            <div class="trim-grid">
              <div>
                <label for="trimTop"><span>Top</span></label>
                <input id="trimTop" type="range" min="0" max="45" value="0" />
              </div>
              <div>
                <label for="trimRight"><span>Right</span></label>
                <input id="trimRight" type="range" min="0" max="45" value="0" />
              </div>
              <div>
                <label for="trimBottom"><span>Bottom</span></label>
                <input id="trimBottom" type="range" min="0" max="45" value="0" />
              </div>
              <div>
                <label for="trimLeft"><span>Left</span></label>
                <input id="trimLeft" type="range" min="0" max="45" value="0" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <p class="caption">Run right — dodge the fireball — don’t stop!</p>
    </div>

    <script>
      (function () {
        const fireball = document.getElementById("fireball");
        const ballOuter = document.getElementById("ballOuter");
        const ballInner = document.getElementById("ballInner");
        const ballImg = document.getElementById("ballImg");
        const ballDefault = document.getElementById("ballDefault");
        const ballUpload = document.getElementById("ballUpload");
        const ballSize = document.getElementById("ballSize");
        const ballSizeLabel = document.getElementById("ballSizeLabel");
        const flipH = document.getElementById("flipH");
        const flipV = document.getElementById("flipV");
        const trimTop = document.getElementById("trimTop");
        const trimRight = document.getElementById("trimRight");
        const trimBottom = document.getElementById("trimBottom");
        const trimLeft = document.getElementById("trimLeft");

        let hasCustomImage = false;
        function easeInCubic(t) {
          return t * t * t;
        }

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function applyBallStyles() {
          const px = ballSize.value;
          ballOuter.style.setProperty("--ball-size", px + "px");
          ballSizeLabel.textContent = px;

          const sx = flipH.checked ? -1 : 1;
          const sy = flipV.checked ? -1 : 1;

          const top = trimTop.value + "%";
          const right = trimRight.value + "%";
          const bottom = trimBottom.value + "%";
          const left = trimLeft.value + "%";

          if (hasCustomImage) {
            ballImg.classList.remove("is-hidden");
            ballDefault.classList.add("is-hidden");
            ballImg.style.clipPath = `inset(${top} ${right} ${bottom} ${left})`;
            ballImg.style.transform = `scale(${sx}, ${sy})`;
          } else {
            ballImg.classList.add("is-hidden");
            ballDefault.classList.remove("is-hidden");
            ballImg.style.clipPath = "";
            ballImg.style.transform = "";
          }
        }

        ballUpload.addEventListener("change", function () {
          const file = ballUpload.files && ballUpload.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function () {
            ballImg.src = reader.result;
            hasCustomImage = true;
            applyBallStyles();
          };
          reader.readAsDataURL(file);
        });

        [
          ballSize,
          flipH,
          flipV,
          trimTop,
          trimRight,
          trimBottom,
          trimLeft,
        ].forEach(function (el) {
          el.addEventListener("input", applyBallStyles);
        });

        applyBallStyles();

        /* --- Flight path: dramatic swoop + natural damped jiggle on ground --- */
        const CYCLE_MS = 4200;
        let start = performance.now();

        function flySample(k) {
          const tx =
            52 -
            easeInCubic(k) * 228 +
            Math.sin(k * Math.PI * 1.15) * 34 * (1 - Math.pow(k - 0.55, 2));
          const arcLift = (1 - Math.cos(Math.PI * k)) / 2;
          const ty = -42 + arcLift * 142 + Math.sin(k * Math.PI * 2.4) * 16 * (1 - k);
          const rotDeg = Math.sin(k * Math.PI * 2.8) * 22 * (1 - k * 0.35);
          return { tx, ty, rotDeg };
        }

        function sampleMotion(u) {
          /* u in [0,1) — translate is added to fireball base position */
          const flyEnd = 0.5;
          const tuckEnd = 0.64;
          const jiggleEnd = 0.88;

          let tx = 0;
          let ty = 0;
          let scaleX = 1;
          let scaleY = 1;
          let rotDeg = 0;

          const fly1 = flySample(1);

          if (u < flyEnd) {
            const k = u / flyEnd;
            const f = flySample(k);
            tx = f.tx;
            ty = f.ty;
            rotDeg = f.rotDeg;
          } else if (u < tuckEnd) {
            const k = (u - flyEnd) / (tuckEnd - flyEnd);
            tx = fly1.tx + easeOutCubic(k) * -42;
            ty = fly1.ty + easeInCubic(k) * 44;
            rotDeg = fly1.rotDeg * (1 - k);
          } else if (u < jiggleEnd) {
            const k = (u - tuckEnd) / (jiggleEnd - tuckEnd);
            tx = fly1.tx - 42;
            ty = fly1.ty + 44;
            const damp = Math.exp(-11 * k);
            const wobble = Math.sin(k * Math.PI * 10);
            rotDeg = wobble * 18 * damp + Math.sin(k * Math.PI * 19) * 8 * damp;
            scaleX = 1 + Math.abs(wobble) * 0.2 * damp;
            scaleY = 1 - Math.abs(wobble) * 0.28 * damp;
            ty -= Math.abs(Math.sin(k * Math.PI * 13)) * 11 * damp;
            ty += Math.sin(k * Math.PI * 23) * 4 * damp;
          } else {
            const k = (u - jiggleEnd) / (1 - jiggleEnd);
            tx = fly1.tx - 42;
            ty = fly1.ty + 44 + Math.sin(k * Math.PI * 2 * 2.8) * 3;
            scaleX = 1;
            scaleY = 1;
            rotDeg = Math.sin(k * Math.PI * 2 * 3.5) * 2.8;
          }

          return { tx, ty, scaleX, scaleY, rotDeg };
        }

        function frame(now) {
          const u = ((now - start) % CYCLE_MS) / CYCLE_MS;
          const m = sampleMotion(u);

          fireball.style.transform = `translate(${m.tx}px, ${m.ty}px)`;
          ballInner.style.transform = `scale(${m.scaleX}, ${m.scaleY}) rotate(${m.rotDeg}deg)`;

          if (hasCustomImage) {
            const imgSx = flipH.checked ? -1 : 1;
            const imgSy = flipV.checked ? -1 : 1;
            ballImg.style.clipPath = `inset(${trimTop.value}% ${trimRight.value}% ${trimBottom.value}% ${trimLeft.value}%)`;
            ballImg.style.transform = `scale(${imgSx}, ${imgSy})`;
          }

          requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
