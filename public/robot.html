<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot controls</title>
<link rel="stylesheet" href="/assets/robot.css">
<script defer src="/assets/robot.js"></script>
<main>
  <h1>Robot controls</h1>
  <p>Raise the wheels for testing. Keep the USB power cable slack.</p>
  <label>Robot password <input id="password" type="password" autocomplete="off"></label>
  <button id="connect">Enable controls</button>
  <p id="status" role="status" aria-live="polite">Controls locked</p>
  <fieldset id="controls" disabled>
    <legend>Hold to move; release to stop</legend>
    <div class="pad">
      <button data-direction="forward" class="forward">Forward ↑</button>
      <button data-direction="left">Left ←</button>
      <button id="stop">STOP</button>
      <button data-direction="right">Right →</button>
      <button data-direction="backward" class="backward">Reverse ↓</button>
    </div>
    <label>Speed <input id="speed" type="range" min="0" max="0.6" step="0.05" value="0.3"> <output id="speed-value">30%</output></label>
    <p>Arrow keys move while held. Space or Escape stops.</p>
    <details><summary>Wheels raised: calibration</summary>
      <p>Hold briefly to test each wheel independently. These use the same timeout and speed limit.</p>
      <button data-direction="test-left">Test left wheel</button>
      <button data-direction="test-right">Test right wheel</button>
    </details>
  </fieldset>
</main>
</html>
